<!DOCTYPE html>
<html>
<head>
    <title>AFIT Admin Dashboard</title>
    <style>
        body { background: #0b1120; color: white; font-family: sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: #161e2d; padding: 30px; border-radius: 12px; text-align: center; border-top: 4px solid #3b82f6; }
        .stat-card.green { border-top-color: #22c55e; }
        .stat-card.orange { border-top-color: #f59e0b; }
        .val { font-size: 48px; font-weight: bold; display: block; margin-bottom: 10px; }
        .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 ADMIN DASHBOARD</h1>
        <a href="/" style="color:#94a3b8; text-decoration:none;">← Student Portal</a>
    </div>

    <div class="grid">
        <div class="stat-card"><span class="val" id="total">0</span><span class="label">Total Bookings Today</span></div>
        <div class="stat-card green"><span class="val" id="completed">0</span><span class="label">Trips Completed</span></div>
        <div class="stat-card orange"><span class="val" id="queued">0</span><span class="label">Currently Queued</span></div>
        <div class="stat-card"><span class="val" id="active">0</span><span class="label">Active Trips</span></div>
        <div class="stat-card green"><span class="val" id="free">6</span><span class="label">Free Tricycles</span></div>
        <div class="stat-card orange"><span class="val">8</span><span class="label">Avg Wait (Min)</span></div>
    </div>

    <script>
        async function refresh() {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('total').innerText = data.total_bookings;
            document.getElementById('completed').innerText = data.completed_trips;
            document.getElementById('queued').innerText = data.currently_queued;
            document.getElementById('active').innerText = data.active_trips;
            document.getElementById('free').innerText = data.free_tricycles;
        }
        setInterval(refresh, 2000);
    </script>
</body>
</html>
