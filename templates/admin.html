<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AFIT Keke — Admin Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b1120; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { color: #3b82f6; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.05); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { color: #64748b; font-size: 12px; text-transform: uppercase; }
        .status-queued { color: #f59e0b; font-weight: bold; }
        .status-assigned { color: #22c55e; font-weight: bold; }
        .refresh-tag { font-size: 10px; color: #64748b; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <span class="refresh-tag" id="last-update">Updating...</span>
        <h1>🛺 Fleet Control Center</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Ticket</th>
                    <th>Student Name</th>
                    <th>Route</th>
                    <th>Status</th>
                    <th>Assigned Keke</th>
                </tr>
            </thead>
            <tbody id="admin-table-body">
                <tr><td colspan="5">Loading live data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // The key must match the ADMIN_KEY in your app.py
        const ADMIN_KEY = "afit2026";

        async function refreshAdminDashboard() {
            try {
                const res = await fetch(`/admin/all_data?key=${ADMIN_KEY}`);
                if (!res.ok) throw new Error("Unauthorized");
                
                const data = await res.json();
                const tableBody = document.getElementById('admin-table-body');
                
                if (data.bookings.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px;">No active bookings in system.</td></tr>';
                } else {
                    tableBody.innerHTML = data.bookings.map(b => `
                        <tr>
                            <td><code>${b.ticket_code}</code></td>
                            <td>${b.name}</td>
                            <td>${b.pickup} → ${b.destination}</td>
                            <td><span class="status-${b.status}">${b.status.toUpperCase()}</span></td>
                            <td>${b.tricycle || '—'}</td>
                        </tr>
                    `).join('');
                }
                document.getElementById('last-update').textContent = "Last sync: " + new Date().toLocaleTimeString();
            } catch (err) {
                document.getElementById('admin-table-body').innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">Error: ' + err.message + '. Ensure URL includes ?key=afit2026</td></tr>';
            }
        }

        // Auto-refresh every 5 seconds
        setInterval(refreshAdminDashboard, 5000);
        refreshAdminDashboard();
    </script>
</body>
</html>
