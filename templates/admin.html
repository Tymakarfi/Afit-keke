<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFIT Keke — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b1120; --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09); --text: #e2e8f0; --muted: #64748b; --blue: #3b82f6; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .h-title h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 2px; margin: 0; }
    .h-title p { font-size: 11px; color: var(--muted); margin: 5px 0 0; }
    .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 12px; }

    /* Stats Grid from image_18.png */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px 20px; text-align: center; }
    .stat-num { font-size: 48px; font-weight: 300; color: #fff; margin-bottom: 10px; }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

    .section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .data-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .empty-msg { color: var(--muted); font-size: 13px; padding: 10px 0; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-size: 10px; text-transform: uppercase; padding: 10px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.02); }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .status-queued { background: rgba(245,158,11,0.1); color: #f59e0b; }
    .status-assigned { background: rgba(34,197,94,0.1); color: #22c55e; }
  </style>
</head>
<body>

<header>
  <div class="h-title">
    <h1>📊 ADMIN DASHBOARD</h1>
    <p>AFIT Smart-Keke — Management View</p>
  </div>
  <a href="/" class="back-btn">← Student Portal</a>
</header>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-num" id="stat-total">0</div>
    <div class="stat-label">Total Bookings Today</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-completed">0</div>
    <div class="stat-label">Trips Completed</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-queued">0</div>
    <div class="stat-label">Currently Queued</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-active">0</div>
    <div class="stat-label">Active Trips</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-free">6</div>
    <div class="stat-label">Free Tricycles</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-wait">8</div>
    <div class="stat-label">Avg Wait (Min)</div>
  </div>
</div>

<div class="section-title">📍 Top Routes Today</div>
<div class="data-card">
  <div id="routes-list" class="empty-msg">No data yet</div>
</div>

<div class="section-title">🕒 Recent Bookings</div>
<div class="data-card">
  <table id="bookings-table">
    <thead>
      <tr>
        <th>Ticket</th>
        <th>Student</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="admin-table-body">
      <!-- Data will appear here -->
    </tbody>
  </table>
</div>

<script>
  const ADMIN_KEY = "afit2026"; // Ensure this matches your app.py

  async function updateDashboard() {
    try {
      const res = await fetch(`/admin/all_data?key=${ADMIN_KEY}`);
      const data = await res.json();

      // Update the 6 Stat Cards
      document.getElementById('stat-total').textContent = data.bookings.length;
      document.getElementById('stat-queued').textContent = data.bookings.filter(b => b.status === 'queued').length;
      document.getElementById('stat-active').textContent = data.bookings.filter(b => b.status === 'assigned').length;
      document.getElementById('stat-free').textContent = data.tricycles.filter(t => t.status === 'free').length;
      
      // Update the Bookings Table
      const tableBody = document.getElementById('admin-table-body');
      if (data.bookings.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" class="empty-msg">No recent bookings</td></tr>';
      } else {
        tableBody.innerHTML = data.bookings.slice(-5).reverse().map(b => `
          <tr>
            <td><code>${b.ticket_code}</code></td>
            <td>${b.name}</td>
            <td><span class="status-badge status-${b.status}">${b.status.toUpperCase()}</span></td>
          </tr>
        `).join('');
      }
    } catch (err) {
      console.error("Dashboard Sync Error:", err);
    }
  }

  setInterval(updateDashboard, 5000);
  updateDashboard();
</script>

</body>
</html>
