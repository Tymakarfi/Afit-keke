<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFIT Smart-Keke | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120;
            --card: rgba(22, 30, 45, 0.85);
            --border: rgba(255,255,255,0.1);
            --blue: #3b82f6;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b1120 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .portal-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 45px 35px;
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .logo-emoji { font-size: 40px; margin-bottom: 10px; display: block; }
        .logo-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #fff; margin-bottom: 4px; }
        .logo-sub { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 28px; }
        .portal-header { font-size: 11px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: #fff; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        input, select {
            width: 100%; padding: 14px 16px;
            border-radius: 12px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: #fff; font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none; transition: all 0.2s ease;
        }
        input::placeholder { color: rgba(255,255,255,0.2); }
        input:focus, select:focus { border-color: var(--blue); background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        select option { background: #1e293b; }
        .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; display: none; text-align: left; }
        .btn-access {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: none; border-radius: 12px;
            color: white; font-weight: 700; font-size: 14px;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; margin-top: 8px;
            box-shadow: 0 8px 20px -4px rgba(59,130,246,0.4);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-access:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-access:active { transform: scale(0.98); }
        .portal-links { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
        .portal-link { font-size: 11px; color: var(--muted); text-decoration: none; }
        .portal-link:hover { color: var(--blue); }
        .footer-text { margin-top: 20px; font-size: 9px; color: #334155; line-height: 1.6; }
    </style>
</head>
<body>
<div class="portal-card">
    <span class="logo-emoji">🛺</span>
    <div class="logo-title">AFIT SMART-KEKE</div>
    <div class="logo-sub">Campus Tricycle Booking System</div>
    <div class="portal-header">Student Portal Access</div>

```
<div class="error-msg" id="err-msg"></div>

<div class="input-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="e.g. Tahir Makarfi"/>
</div>
<div class="input-group">
    <label for="matric">Matric Number</label>
    <input type="text" id="matric" placeholder="e.g. U22CS1082"/>
</div>
<div class="input-group">
    <label for="faculty">Faculty</label>
    <select id="faculty">
        <option value="Computing">Computing</option>
        <option value="Engineering">Engineering</option>
        <option value="Airship">Airship &amp; Applied Sciences</option>
        <option value="Management">Management Sciences</option>
    </select>
</div>

<button class="btn-access" onclick="enterSystem()">Access System →</button>

<div class="portal-links">
    <a href="/driver" class="portal-link">🚗 Driver Panel</a>
    <a href="/admin" class="portal-link">📊 Admin Dashboard</a>
</div>

<div class="footer-text">
    Air Force Institute of Technology, Kaduna<br>
    Smart Campus Transport Management System
</div>
```

</div>

<script>
    async function enterSystem() {
        const name    = document.getElementById('name').value.trim();
        const matric  = document.getElementById('matric').value.trim().toUpperCase();
        const faculty = document.getElementById('faculty').value;
        const err     = document.getElementById('err-msg');

        err.style.display = 'none';
        if (!name || !matric) { showErr('Please enter your name and matric number.'); return; }
        if (!matric.startsWith('U')) { showErr('Invalid matric number. Must start with U (e.g. U22CS1082).'); return; }

        try {
            const res  = await fetch('/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, matric, faculty}) });
            const data = await res.json();
            if (data.status === 'success') { window.location.href = '/'; }
            else { showErr(data.message || 'Login failed. Please try again.'); }
        } catch (e) { showErr('Connection error. Make sure the server is running.'); }
    }

    function showErr(msg) { const el = document.getElementById('err-msg'); el.textContent = msg; el.style.display = 'block'; }
    document.addEventListener('keypress', e => { if (e.key === 'Enter') enterSystem(); });
</script>

</body>
</html>
