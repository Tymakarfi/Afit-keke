<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFIT Smart-Keke - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #1e40af; --blue2: #3b82f6; --bg: #0b1120; --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09); --text: #e2e8f0; --muted: #64748b; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; backdrop-filter: blur(10px); }
    .logo { font-size: 48px; margin-bottom: 10px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; margin: 0; }
    p { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; }
    .field { text-align: left; margin-bottom: 20px; }
    label { display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
    input, select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; }
    input:focus { border-color: var(--blue2); }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--blue), var(--blue2)); border: none; border-radius: 8px; color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 20px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">🛺</div>
  <h1>AFIT SMART-KEKE</h1>
  <p>Student Portal Access</p>
  
  <div class="field">
    <label>Full Name</label>
    <input type="text" id="l-name" placeholder="Enter Full Name">
  </div>
  
  <div class="field">
    <label>Matric Number</label>
    <input type="text" id="l-matric" placeholder="e.g. U22CS1082">
  </div>
  
  <div class="field">
    <label>Faculty</label>
    <select id="l-faculty">
      <option>Computing</option>
      <option>Engineering</option>
      <option>Management Sciences</option>
    </select>
  </div>
  
  <button class="btn" onclick="login()">ACCESS SYSTEM</button>
</div>

<script>
  function login() {
    const name = document.getElementById('l-name').value;
    const matric = document.getElementById('l-matric').value;
    const faculty = document.getElementById('l-faculty').value;

    if (!name || !matric) {
      alert("Please enter your name and matric number.");
      return;
    }

    // This is the part that was likely missing:
    const userData = {
      name: name,
      matric: matric,
      faculty: faculty
    };

    // Save to the browser's memory
    localStorage.setItem("afit_user", JSON.stringify(userData));

    // Send the user back to the main page
    window.location.href = "/";
  }
</script>

</body>
</html>
