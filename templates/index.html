<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFIT Smart-Keke — Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b1120; --card: rgba(22, 30, 45, 0.7); --border: rgba(255, 255, 255, 0.1); --blue: #3b82f6; --text: #f8fafc; --muted: #94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 400px; }

        /* Login / Portal Style (Verbatim from image) */
        .portal-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px 30px; backdrop-filter: blur(10px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; }
        .logo-title { font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #fff; margin-bottom: 5px; }
        .logo-sub { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .portal-header { font-size: 12px; font-weight: 700; color: #60a5fa; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 35px; }

        .input-group { text-align: left; margin-bottom: 25px; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: #fff; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        
        /* Glass Input Style */
        input, select { 
            width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--border); 
            background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 14px; box-sizing: border-box; 
            outline: none; transition: 0.3s;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus { border-color: var(--blue); background: rgba(255, 255, 255, 0.1); }

        .btn-access { 
            width: 100%; padding: 18px; background: var(--blue); border: none; border-radius: 12px; 
            color: white; font-weight: 700; font-size: 14px; text-transform: uppercase; 
            letter-spacing: 1px; cursor: pointer; margin-top: 10px; box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }

        /* Dashboard Styles (Hidden until Login) */
        #main-dashboard { display: none; width: 100%; }
        .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .fleet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .keke-card { border-radius: 12px; padding: 15px 5px; text-align: center; background: rgba(255,255,255,0.02); border: 1px solid var(--border); }
        .keke-busy { border-color: #f6ad55; color: #f6ad55; }
        .keke-free { border-color: #48bb78; color: #48bb78; }
        svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 5px; }
        .keke-name { font-size: 10px; font-weight: 700; display: block; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN PORTAL (Exactly like image) -->
    <div id="login-portal" class="portal-card">
        <div class="logo-title">AFIT SMART-KEKE</div>
        <div class="logo-sub">Campus Tricycle Booking System</div>
        
        <div class="portal-header">Student Portal Access</div>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="user-name" placeholder="e.g. John Doe">
        </div>

        <div class="input-group">
            <label>Matric Number</label>
            <input type="text" id="user-matric" placeholder="e.g. AFIT/UG/26/0000">
        </div>

        <div class="input-group">
            <label>Faculty</label>
            <select id="user-faculty">
                <option>Computing</option>
                <option>Engineering</option>
                <option>Airship & Labs</option>
            </select>
        </div>

        <button class="btn-access" onclick="enterSystem()">Access System</button>
    </div>

    <!-- MAIN DASHBOARD (Restored Fleet View) -->
    <div id="main-dashboard">
        <div class="section-card" style="text-align:center">
            <div style="font-size:10px; color:var(--blue); font-weight:800; margin-bottom:10px;">ACTIVE SYSTEM SESSION</div>
            <div id="display-name" style="font-size:18px; font-weight:700;"></div>
        </div>

        <div class="section-card">
            <div style="font-size:10px; font-weight:800; color:var(--blue); margin-bottom:15px;">🛺 FLEET STATUS</div>
            <div class="fleet-grid" id="fleet-grid"></div>
        </div>

        <div id="booking-area" class="section-card">
            <div style="font-size:10px; font-weight:800; color:var(--blue); margin-bottom:15px;">📝 REQUEST DISPATCH</div>
            <select id="pickup"><option>Main Gate</option><option>Hostel</option></select>
            <select id="destination" style="margin-top:10px;"><option>Admin Block</option><option>Library</option></select>
            <button class="btn-access" onclick="submitBooking()" style="margin-top:15px;">Book Keke</button>
        </div>

        <div id="active-ticket" class="section-card" style="display:none; text-align:center; border: 1px dashed var(--blue);">
            <div style="font-size:10px; color:var(--blue); font-weight:800;">YOUR TICKET</div>
            <div id="ticket-val" style="font-size:24px; font-weight:800; margin:10px 0;"></div>
            <div id="status-text" style="font-size:11px; color:var(--muted);"></div>
        </div>
    </div>
</div>

<script>
    let session = JSON.parse(localStorage.getItem('afit_session'));
    let myBookingId = localStorage.getItem('afit_bid');
    const kekeSvg = `<svg viewBox="0 0 24 24"><path d="M21,11C21,11 21,10.1 21,9C21,7.9 20.1,7 19,7H17L15.3,3.6C15.1,3.2 14.7,3 14.3,3H9.7C9.3,3 8.9,3.2 8.7,3.6L7,7H5C3.9,7 3,7.9 3,9C3,10.1 3,11 3,11H2V13H3V18H5V21H7V18H17V21H19V18H21V13H22V11H21M9.2,5H14.8L15.8,7H8.2L9.2,5M5,9H19V11H5V9M5,13H19V16H5V13Z" /></svg>`;

    function enterSystem() {
        const name = document.getElementById('user-name').value || "John Doe";
        const matric = document.getElementById('user-matric').value || "AFIT/UG/26/0000";
        session = { name, matric };
        localStorage.setItem('afit_session', JSON.stringify(session));
        checkSession();
    }

    function checkSession() {
        if(session) {
            document.getElementById('login-portal').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('display-name').textContent = session.name;
            updateDashboard();
            setInterval(updateDashboard, 3000);
        }
    }

    async function submitBooking() {
        const res = await fetch('/book', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: session.name, matric: session.matric,
                pickup: document.getElementById('pickup').value,
                destination: document.getElementById('destination').value
            })
        });
        const data = await res.json();
        myBookingId = data.booking_id;
        localStorage.setItem('afit_bid', myBookingId);
        updateDashboard();
    }

    async function updateDashboard() {
        const res = await fetch('/status');
        const data = await res.json();

        const grid = document.getElementById('fleet-grid');
        grid.innerHTML = data.tricycles.map(t => `
            <div class="keke-card ${t.status === 'busy' ? 'keke-busy' : 'keke-free'}">
                ${kekeSvg}
                <span class="keke-name">${t.label}</span>
                <span style="font-size:8px; font-weight:800;">${t.status.toUpperCase()}</span>
            </div>
        `).join('');

        if (myBookingId) {
            const bRes = await fetch(`/mybooking/${myBookingId}`);
            const bData = await bRes.json();
            if (bData.status === 'completed') {
                localStorage.removeItem('afit_bid');
                myBookingId = null;
                location.reload();
            } else {
                document.getElementById('booking-area').style.display = 'none';
                document.getElementById('active-ticket').style.display = 'block';
                document.getElementById('ticket-val').textContent = bData.ticket_code;
                document.getElementById('status-text').textContent = bData.status === 'assigned' ? `ON TRIP WITH ${bData.tricycle}` : `QUEUED AT #${bData.queue_position}`;
            }
        }
    }

    checkSession();
</script>
</body>
</html>
