<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFIT Smart-Keke | Student Dashboard</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #161e2d;
            --accent-blue: #3b82f6;
            --accent-gold: #f6ad55;
            --success-green: #48bb78;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #2d3748;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .logo { font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }
        .logout-btn { color: var(--accent-blue); text-decoration: none; font-size: 0.85rem; font-weight: 600; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        /* Fleet Grid */
        .fleet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .keke-unit {
            padding: 12px 5px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .keke-name { font-size: 0.75rem; font-weight: 700; }
        .keke-status { font-size: 0.6rem; text-transform: uppercase; font-weight: 900; }

        .free { background: rgba(72, 187, 120, 0.1); border-color: var(--success-green); color: var(--success-green); }
        .busy { background: rgba(246, 173, 85, 0.1); border-color: var(--accent-gold); color: var(--accent-gold); }

        /* Form */
        select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            margin-bottom: 15px;
        }

        .btn-book {
            width: 100%;
            padding: 15px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Ticket */
        .ticket-display {
            text-align: center;
            padding: 20px;
            border: 2px dashed var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
            border-radius: 15px;
        }

        .ticket-id { font-size: 2rem; font-weight: 900; color: var(--accent-blue); }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <div class="logo">AFIT SMART-KEKE</div>
        <a href="/api/logout" class="logout-btn">LOGOUT</a>
    </header>

    <div id="status-area"></div>

    <div class="card">
        <div class="section-title">🛺 Fleet Status</div>
        <div class="fleet-grid" id="fleet-display"></div>
    </div>

    <div class="card" id="booking-section">
        <div class="section-title">📝 Request a Ride</div>
        <select id="pickup">
            <option value="" disabled selected>Select Pickup</option>
            <option>Main Gate</option><option>Academic Block</option><option>Library</option>
            <option>Hostel A</option><option>Hostel B</option><option>Sports Complex</option>
            <option>Clinic</option><option>Mess Hall</option><option>Admin Block</option><option>Engineering Lab</option>
        </select>
        <select id="destination">
            <option value="" disabled selected>Select Destination</option>
            <option>Main Gate</option><option>Academic Block</option><option>Library</option>
            <option>Hostel A</option><option>Hostel B</option><option>Sports Complex</option>
            <option>Clinic</option><option>Mess Hall</option><option>Admin Block</option><option>Engineering Lab</option>
        </select>
        <button class="btn-book" onclick="submitBooking()">CONFIRM BOOKING</button>
    </div>
</div>

<script>
    async function submitBooking() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        if (!p || !d) return alert("Select locations");

        await fetch('/api/book', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ pickup: p, destination: d })
        });
        updateDashboard();
    }

    async function updateDashboard() {
        const res = await fetch('/api/state');
        const data = await res.json();

        // Update Fleet
        document.getElementById('fleet-display').innerHTML = data.fleet.map(keke => `
            <div class="keke-unit ${keke.status}">
                <div class="keke-name">${keke.label}</div>
                <div class="keke-status">${keke.status}</div>
            </div>
        `).join('');

        // Update Ticket/Status
        const statusArea = document.getElementById('status-area');
        const bookingSection = document.getElementById('booking-section');

        if (data.personal_booking) {
            bookingSection.style.display = 'none';
            if (data.personal_booking.status === 'queued') {
                statusArea.innerHTML = `
                    <div class="card ticket-display">
                        <div class="section-title">Active Ticket</div>
                        <div class="ticket-id">${data.personal_booking.ticket.ticket_code}</div>
                        <div style="font-size: 0.8rem;">Position: #${data.personal_booking.position}</div>
                    </div>`;
            } else {
                statusArea.innerHTML = `
                    <div class="card ticket-display" style="border-color: var(--success-green);">
                        <div class="section-title" style="color: var(--success-green);">Ride Active</div>
                        <div class="ticket-id" style="color: var(--success-green); font-size: 1.2rem;">${data.personal_booking.keke_label}</div>
                        <div style="font-size: 0.8rem;">Route: ${data.personal_booking.route}</div>
                    </div>`;
            }
        } else {
            bookingSection.style.display = 'block';
            statusArea.innerHTML = '';
        }
    }

    setInterval(updateDashboard, 3000);
    updateDashboard();
</script>
</body>
</html>
