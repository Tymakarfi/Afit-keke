    <style>
        :root {
            --bg-color: #0b1120;

        .keke-unit {
            padding: 12px 5px; border-radius: 12px;
            border: 1px solid var(--border); text-align: center;

        .free { background: rgba(72,187,120,0.1); border-color: var(--success-green); color: var(--success-green); }
        .busy { background: rgba(246,173,85,0.1); border-color: var(--accent-gold); color: var(--accent-gold); }

<body>
<div class="dashboard-container">

<div class="card">
    <div class="section-title">Fleet Status</div>

<div class="card" id="booking-section">
    <div class="section-title">Request a Ride</div>
    <div class="error-msg" id="err-msg"></div>
    <select id="pickup">
        <option value="" disabled selected>-- Select Pickup --</option>
        <option>Main Gate</option>
        <option>Academic Block</option>
        <option>Library</option>
        <option>Hostel A</option>
        <option>Hostel B</option>

    </select>
    <select id="destination">
        <option value="" disabled selected>-- Select Destination --</option>
        <option>Main Gate</option>
        <option>Academic Block</option>
        <option>Library</option>
        <option>Hostel A</option>
        <option>Hostel B</option>

        <option>Mess Hall</option>
        <option>Admin Block</option>

    </select>
    <button class="btn-book" id="book-btn" onclick="submitBooking()">CONFIRM BOOKING</button>

```

</div>

<script>
    let countdown = null;

    async function submitBooking() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        const err = document.getElementById('err-msg');
        err.style.display = 'none';

        if (!p || !d) { showError('Please select both pickup and destination.'); return; }
        if (p === d) { showError('Pickup and destination cannot be the same.'); return; }

        const btn = document.getElementById('book-btn');
        btn.disabled = true; btn.textContent = 'BOOKING...';

        try {
            const res = await fetch('/api/book', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ pickup: p, destination: d })
            });
            const data = await res.json();
            if (data.error) { showError(data.error); btn.disabled = false; btn.textContent = 'CONFIRM BOOKING'; return; }
            updateDashboard();
        } catch (e) {
            showError('Connection error. Please try again.');
            btn.disabled = false; btn.textContent = 'CONFIRM BOOKING';
        }
    }

    function showError(msg) {
        const el = document.getElementById('err-msg');
        el.textContent = msg; el.style.display = 'block';
    }

    function startCountdown(seconds, onDone) {
        if (countdown) clearInterval(countdown);
        const el = document.getElementById('countdown-timer');
        if (!el) return;
        let remaining = seconds;
        el.textContent = remaining + 's';
        countdown = setInterval(() => {
            remaining--;
            if (el) el.textContent = remaining + 's';
            if (remaining <= 0) {
                clearInterval(countdown);
                countdown = null;
                if (onDone) onDone();
            }
        }, 1000);
    }

    async function updateDashboard() {
        try {
            const res = await fetch('/api/state');
            if (res.status === 401) { window.location.href = '/login'; return; }
            const data = await res.json();

            // Fleet
            document.getElementById('fleet-display').innerHTML = data.fleet.map(keke => `
                <div class="keke-unit ${keke.status}">
                    <div style="font-size:1.4rem">🛺</div>
                    <div class="keke-name">${keke.label}</div>
                    <div class="keke-status">${keke.status === 'free' ? 'FREE' : 'BUSY'}</div>
                </div>
            `).join('');

            const statusArea = document.getElementById('status-area');
            const bookingSection = document.getElementById('booking-section');

            if (data.personal_booking) {
                bookingSection.style.display = 'none';
                const b = data.personal_booking;

                if (b.status === 'queued') {
                    const waitMins = data.avg_wait || 8;
                    statusArea.innerHTML = `
                        <div class="card ticket-display">
                            <div class="section-title" style="justify-content:center">Your Ticket</div>
                            <div class="ticket-id">${b.ticket.ticket_code}</div>
                            <div class="queue-badge">QUEUE POSITION #${b.position}</div>
                            <div class="wait-info">
                                Est. wait: <span class="wait-time">${waitMins} min${waitMins !== 1 ? 's' : ''}</span><br>
                                <small>A keke will be assigned to you shortly</small>
                            </div>
                            <div class="ticket-label" style="margin-top:14px">ROUTE</div>
                            <div class="ticket-value">${b.ticket.pickup} &rarr; ${b.ticket.destination}</div>
                            <div><button class="cancel-btn" onclick="cancelBooking()">Cancel Booking</button></div>
                        </div>`;
                } else if (b.status === 'assigned') {
                    statusArea.innerHTML = `
                        <div class="card ticket-display" style="border-color: var(--success-green); background: rgba(72,187,120,0.05);">
                            <div class="section-title" style="color:var(--success-green);text-align:center">Ride Assigned!</div>
                            <div class="ticket-id" style="color:var(--success-green); font-size:1.4rem">${b.keke_label}</div>
                            <div class="assigned-badge">ON YOUR WAY</div>
                            <div class="ticket-label" style="margin-top:14px">TICKET</div>
                            <div class="ticket-value" style="color:var(--accent-blue)">${b.ticket.ticket_code}</div>
                            <div class="ticket-label" style="margin-top:8px">ROUTE</div>
                            <div class="ticket-value">${b.ticket.pickup} &rarr; ${b.ticket.destination}</div>
                            <div class="wait-info">
                                Trip completes in ~<span id="countdown-timer" class="wait-time">60s</span>
                            </div>
                        </div>`;
                    startCountdown(60, updateDashboard);
                }
            } else {
                if (countdown) { clearInterval(countdown); countdown = null; }
                bookingSection.style.display = 'block';
                document.getElementById('book-btn').disabled = false;
                document.getElementById('book-btn').textContent = 'CONFIRM BOOKING';
                statusArea.innerHTML = '';
            }
        } catch (e) { console.error(e); }
    }

    async function cancelBooking() {
        try {
            const res = await fetch('/api/cancel', { method: 'POST' });
            const data = await res.json();
            if (data.success) updateDashboard();
        } catch (e) { console.error(e); }
    }

    setInterval(updateDashboard, 3000);
    updateDashboard();
</script>

</body>
