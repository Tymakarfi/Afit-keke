<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFIT Smart-Keke — Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3b82f6; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 480px; margin: auto; }
        
        /* Header */
        header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        header h1 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; margin: 0; color: var(--primary); }
        header p { font-size: 12px; color: var(--muted); margin: 5px 0 0; }

        /* General Card Styles */
        .card { background: var(--card); padding: 24px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2 { font-size: 16px; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* Form Elements */
        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 16px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; }
        button:hover { background: #2563eb; transform: translateY(-1px); }

        /* Status & Badges */
        .badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; }
        .status-queued { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-assigned { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-completed { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }

        /* Booking Details */
        .ticket-box { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; text-align: center; margin: 15px 0; border: 1px dashed #475569; }
        .ticket-label { font-size: 10px; color: var(--muted); }
        .ticket-code { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 1px; }

        .countdown { font-size: 56px; font-weight: 300; text-align: center; margin: 10px 0; color: var(--primary); }
        .wait-stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }

        /* Live Fleet Mini-Dashboard */
        .fleet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .fleet-card { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .fleet-num { font-size: 20px; font-weight: 600; display: block; }
        .fleet-lab { font-size: 9px; color: var(--muted); text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AFIT Smart-Keke</h1>
        <p>Air Force Institute of Technology — Transport Portal</p>
    </header>

    <!-- Section 1: Live Fleet Overview -->
    <div class="card" id="fleet-overview">
        <h2>📡 Live System Status</h2>
        <div class="fleet-grid">
            <div class="fleet-card">
                <span class="fleet-num" id="live-free">6</span>
                <span class="fleet-lab">Available Kekes</span>
            </div>
            <div class="fleet-card">
                <span class="fleet-num" id="live-wait">0</span>
                <span class="fleet-lab">In Queue</span>
            </div>
        </div>
    </div>

    <!-- Section 2: Booking Form -->
    <div id="booking-form-section" class="card">
        <h2>📝 Request a Ride</h2>
        <label>Personal Information</label>
        <input type="text" id="name" placeholder="Full Name (e.g. John Doe)">
        <input type="text" id="matric" placeholder="Matric No (e.g. AFIT/24/...)">
        
        <label>Trip Details</label>
        <select id="pickup">
            <option value="Main Gate">Main Gate</option>
            <option value="Library">Library</option>
            <option value="Male Hostel">Male Hostel</option>
            <option value="Female Hostel">Female Hostel</option>
        </select>
        <select id="destination">
            <option value="Admin Block">Admin Block</option>
            <option value="Civil Dept">Civil Dept</option>
            <option value="Cyber Security Lab">Cyber Security Lab</option>
            <option value="Mechanical Workshop">Mechanical Workshop</option>
        </select>
        <button onclick="submitBooking()">Initialize Dispatch</button>
    </div>

    <!-- Section 3: Live Status Card (Hidden by default) -->
    <div id="status-card" class="card" style="display: none;">
        <div id="status-body">
            <!-- JavaScript populates this -->
        </div>
    </div>
</div>

<script>
    let myBooking = JSON.parse(localStorage.getItem('afit_booking')) || null;
    let timerInterval = null;
    let secondsLeft = 60;

    // 1. Submit Booking to Backend
    async function submitBooking() {
        const name = document.getElementById('name').value;
        const matric = document.getElementById('matric').value;

        if(!name || !matric) return alert("Please fill in your details!");

        const payload = {
            name: name,
            matric: matric,
            pickup: document.getElementById('pickup').value,
            destination: document.getElementById('destination').value
        };

        const res = await fetch('/book', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        myBooking = await res.json();
        localStorage.setItem('afit_booking', JSON.stringify(myBooking));
        refreshUI();
    }

    // 2. Main UI Refresh Logic
    async function refreshUI() {
        // Always update the Live Fleet Overview
        const statusRes = await fetch('/status');
        const systemData = await statusRes.json();
        document.getElementById('live-free').textContent = systemData.tricycles.filter(t => t.status === 'free').length;
        document.getElementById('live-wait').textContent = systemData.queue_count;

        if (!myBooking) return;

        const res = await fetch(`/mybooking/${myBooking.booking_id}`);
        const data = await res.json();

        const form = document.getElementById('booking-form-section');
        const card = document.getElementById('status-card');
        const body = document.getElementById('status-body');

        form.style.display = "none";
        card.style.display = "block";

        if (data.status === "queued") {
            body.innerHTML = `
                <div class="badge status-queued">Awaiting Dispatch</div>
                <div class="ticket-box">
                    <span class="ticket-label">QUEUE POSITION</span>
                    <div class="ticket-code">#${data.queue_position}</div>
                </div>
                <div class="wait-stat"><span>Est. Wait Time:</span> <strong>${data.queue_position * 8} mins</strong></div>
                <div class="wait-stat"><span>Status:</span> <span>Waiting for free Keke...</span></div>
            `;
        } 
        else if (data.status === "assigned") {
            body.innerHTML = `
                <div class="badge status-assigned">Tricycle In Transit</div>
                <div class="ticket-box">
                    <span class="ticket-label">ASSIGNED VEHICLE</span>
                    <div class="ticket-code">${data.tricycle}</div>
                </div>
                <div class="countdown" id="cd-val">${secondsLeft}</div>
                <p style="text-align:center; color:var(--muted); font-size:12px;">Seconds remaining until destination arrival</p>
            `;
            if (!timerInterval) startTimer();
        } 
        else if (data.status === "completed") {
            clearInterval(timerInterval);
            timerInterval = null;
            body.innerHTML = `
                <div class="badge status-completed">Destination Reached</div>
                <h3 style="margin-top:0">Trip Successful</h3>
                <p style="color:var(--muted); font-size:14px;">The tricycle has been released for the next student. Thank you for using AFIT Smart-Keke.</p>
                <button onclick="resetApp()">New Booking</button>
            `;
        }
    }

    // 3. 60-Second Timer Logic
    function startTimer() {
        secondsLeft = 60;
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsLeft--;
            const el = document.getElementById('cd-val');
            if (el) el.textContent = Math.max(0, secondsLeft);
            
            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }, 1000);
    }

    function resetApp() {
        localStorage.removeItem('afit_booking');
        location.reload();
    }

    // Poll server every 4 seconds for status updates
    setInterval(refreshUI, 4000);
    if (myBooking) refreshUI();
</script>

</body>
</html>
